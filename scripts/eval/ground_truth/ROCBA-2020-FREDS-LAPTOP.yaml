    source_lines: "6088-6099"
    corroborates_with: [SRUM_bytes_sent, Browser_history, EVTX_network, MFT_cloud_cache]

  - id: GT-005
    finding_type: attribution             # OUT-OF-STRICT-SCOPE (see caveat)
