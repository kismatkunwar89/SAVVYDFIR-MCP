findings:

  - id: GT-001
    finding_type: file_access            # OUT-OF-STRICT-SCOPE (see caveat)
    artifact_type: ShellBag
    artifact_source: "E:\\C\\Users\\fredr\\AppData\\Local\\Microsoft\\Windows\\UsrClass.dat"
    location_key: "UsrClass.dat / BagMRU"
    expected_status: OBSERVATION
    value: "149 ShellBags parsed from user fredr's UsrClass.dat"
    description: >
      User fredr's UsrClass.dat yields 149 ShellBags evidencing Explorer
      folder navigation. DEFENSIBLE LIMIT: ShellBag = the shell rendered the
      folder, NOT that files inside were opened. Corroborate with LNK / Jump
      Lists / RecentDocs before asserting file access.
    source_lines: "2867-2941"
    corroborates_with: [LNK, JumpList, RecentDocs]

  - id: GT-002
    finding_type: defense_evasion
    artifact_type: Registry
    artifact_source: "C:\\Users\\fredr\\NTUSER.DAT"
    location_key: "Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\ComDlg32\\OpenSavePidlMRU ; Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\TypedPaths"
    expected_status: INFERENCE
    value: "regedit interaction with OpenSavePidlMRU and TypedPaths (per last-write timestamps)"
    description: >
      Based on registry key last-write timestamps, regedit appears to have
      been used to interact with the OpenSavePidlMRU and TypedPaths keys —
      indicative of manual manipulation/clearing of file-open dialog history
      and Explorer typed-path history (anti-forensic tampering with
      file-access evidence).
    registry_paths:
      - "Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\ComDlg32\\OpenSavePidlMRU"
      - "Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\TypedPaths"
    paths_to_verify:
      - "C:\\Users\\fredr\\NTUSER.DAT"
      - "C:\\Windows\\Prefetch\\REGEDIT.EXE-*.pf"
    source_lines: "5955"
    corroborates_with: [Registry_lastwrite, UserAssist_regedit, Prefetch_regedit]

  - id: GT-003
    finding_type: defense_evasion          # also maps to post_exploitation_cleanup
    secondary_finding_type: post_exploitation_cleanup
    artifact_type: Execution               # Prefetch / Amcache / ShimCache + EVTX 4688
    artifact_source: "sdelete.exe execution artifacts"
    location_key: "sdelete (two distinct on-disk locations)"
    expected_status: OBSERVATION
    value: "sdelete run 7x from 2 locations within a 5-min span starting 2020-11-14 13:42:30 UTC"
    description: >
      The Sysinternals sdelete file-wiping tool was executed seven times from
      two different locations within a five-minute span starting
      2020-11-14 13:42:30 UTC — secure-deletion / anti-forensics activity.
    timestamp_utc_start: "2020-11-14T13:42:30Z"
    timestamp_utc_end: "2020-11-14T13:47:30Z"   # DERIVED: start + "five minute span" (not stated verbatim)
    paths_to_verify:
      - "C:\\Windows\\Prefetch\\SDELETE*.pf"
      - "C:\\Users\\fredr\\AppData\\Roaming\\Microsoft\\Windows\\Recent\\"
    source_lines: "5959-5960"
    scorer_detector: sdelete_cipher_trace   # present in baseline_report_scorer.high_signal
    corroborates_with: [Prefetch, Amcache, EVTX_4688, USN_DATA_OVERWRITE]

  - id: GT-004
    finding_type: data_exfil
    artifact_type: Cloud
    artifact_source: "Google Drive for Desktop (account crimsonguard@cobracommandcenter.com)"
