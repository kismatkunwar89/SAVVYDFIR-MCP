# Ground-Truth Answer Key — ROCBA-2020-FREDS-LAPTOP
# ===================================================================
# Insider intellectual-property theft at "Stark Research Labs".
#
# SOURCE OF TRUTH: the case reference material. ALL source_lines below cite that
# material, which is ~95% generic teaching theory; concrete case evidence survives
# in a few textual zones: the `fredr` ShellBags exercise (~L2867-2941), the
# capstone case-summary takeaways (~L5952-6099), the capstone questions
# (~L6003-6024), and the Edge-downloads exercise (~L6502-6524). Everything
# else with a "concrete look" is a teaching example / different image — see
# `known_negatives` and `ambiguous` below.
#
# SCHEMA: aligned to docs/eval-methodology.md §1 (record fields) and §2
# (TP/FP/FN match rule). A produced report.json finding is a TP when it
# matches on (host, finding_type, artifact_type, approximate location) AND
# carries expected status OBSERVATION or INFERENCE (not HYPOTHESIS/REJECTED).
# Match is semantic, NOT exact-string (§2.1).
#
# SCOPE CAVEAT: the §1 nine finding-types are intrusion-oriented. This is an
# insider-exfil case, so it maps cleanly only to data_exfil / defense_evasion
# / post_exploitation_cleanup. `file_access` / `attribution` / `account` /
# `content` records below fall OUTSIDE the strict 9-type scope and are
# flagged; the methodology needs an insider-case extension to score them.
# They are retained because they are court-defensible, reference-stated facts.
#
# PATH NOTE: `registry_paths` are canonical Windows ASEP locations; fields
# named `paths_to_verify` are EXPECTED locations to confirm against the real
# image, NOT values asserted by the reference material. Do not score them as
# observations until confirmed on the image.
# ===================================================================

