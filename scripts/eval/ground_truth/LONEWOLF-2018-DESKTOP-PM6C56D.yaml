# -------------------------------------------------------------------
# KNOWN NEGATIVES (must NOT be reported as case evidence — hallucination controls)
# -------------------------------------------------------------------
known_negatives:
  - artifact_type: Comms
    value: "Human-to-human email or Skype messages proving the plot"
    reason: >
      Skype SQLite + Outlook Unistore showed NO human-to-human plotting comms
      locally — the channel was the covert Brother Chat.gdoc (content on Google
      servers). Do not assert local email/Skype plot messages.
  - artifact_type: AntiForensics
    value: "Use of secure-wipe / data-destruction software (SDelete, cipher, BCWipe)"
    reason: >
      The report explicitly notes routine deletion (5,685 MFT records) but does
      NOT identify any secure-wiping/destruction tool. Do not claim secure wiping.
  - artifact_type: S3
    value: "A specific named S3 bucket"
    reason: "The report does not state an S3 bucket name; rootkey.csv creds are confirmed but the bucket name is not."

