eval_targets:
  - {id: "E-001", question: "What type(s) of attack were performed?", answer_anchor: "SQL injection (sqlmap brute-force) + OS command injection (exec/ &&) + LFI + XSS + CSRF + unrestricted file upload + web-shell RCE against DVWA (security=low)"}
  - {id: "E-002", question: "How many users were added and how?", answer_anchor: "exactly two: user1 (RID 1005, net user user1 Root@psut /add) and hacker (RID 1006, net user hacker hacker /add), via command injection, both added to Remote Desktop Users; EVTX 4720/4732"}
  - {id: "E-003", question: "What leftovers/artifacts did the attacker leave?", answer_anchor: "PHP droppers tmpbiwuc.php/tmpukudk.php/tmpudvfh.php/tmpbrjvl.php, webshell.zip (c99.php+webshell.php), phpshell.php+phpshell2.php, PHP reverse shell to 192.168.56.102:4545, LFI files data.txt/abc.txt + abc dir, RDP firewall rule, 2 local accounts (SAM, no EVTX 4720) - most shells later DELETED"}
  - {id: "E-004", question: "What software was installed and by whom?", answer_anchor: "none installed by attacker; only XAMPP (Apache/MySQL) + DVWA pre-installed"}
  - {id: "E-005", question: "What type of shellcode/payload was used (memory forensics)?", answer_anchor: "NOT binary shellcode — PHP web shells (C99 family) + net user/netsh command strings recovered from httpd.exe (PIDs 2796/2880) via Volatility (Win2008SP2x86, consoles/cmdscan)"}
  - {id: "E-006", question: "Event timeline?", answer_anchor: "2015-09-02 recon 07:10 -> cmd-injection accounts 09:05 -> sqlmap 11:15 -> droppers 11:25; 2015-09-03 07:14 webshells.zip"}
  - {id: "E-007", question: "Hypothesis and investigative approach?", answer_anchor: "external web-app exploitation chain (SQLi/cmd-injection) -> local account creation + RDP enable -> web-shell persistence"}
  - {id: "E-008", question: "Additional observations / directories+files added (bonus)?", answer_anchor: "official answer = NONE persisted - attacker dropped tmp*.php/web shells into DVWA web root then DELETED them (del /F /Q; $LogFile/$UsnJrnl traces); reverse shell to 192.168.56.102:4545; no data exfil / lateral movement observed"}

