# Forensic-knowledge: Windows scheduled-task on-disk XML definitions (System32\Tasks).
# Generic Windows forensic discipline - no case specifics.
artifact: scheduled_tasks
aka:
  - "Scheduled Tasks"
  - "Task Scheduler XML"
  - "System32\\Tasks"
  - "schtasks / Task definitions"

what_it_is: >
  Windows Task Scheduler stores each registered task as an extensionless XML file
  under C:\\Windows\\System32\\Tasks, mirroring the registry TaskCache. Each XML
  encodes the action (command + arguments), triggers, the principal it runs as
  (UserId / RunLevel such as HighestAvailable), the registration info (Author,
  registration Date, URI), and settings (Enabled). On-disk task definitions are a
  classic persistence (T1053.005) and lateral-movement mechanism and survive even
  when the TaskScheduler EVTX has rolled over. They are self-contained and richer
  than the registry side for command/principal detail.

locations:
  - "C:\\Windows\\System32\\Tasks\\<folder>\\<TaskName> - extensionless XML, nested arbitrarily deep (e.g. \\Microsoft\\Windows\\... for built-in tasks)."
  - "Registry side (SOFTWARE hive): Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache - subkeys: Tree (the visible task hierarchy, one key per task with a GUID + the SD security descriptor), Tasks (one key per GUID with the operative metadata), plus Boot / Logon / Plain / Maintenance bucket subkeys grouping tasks by trigger class."
  - "TaskCache\\Tree\\<...\\TaskName> links to TaskCache\\Tasks\\{GUID} by the shared GUID - resolve Tree (human path + SD) to Tasks (Actions/Triggers/timestamps)."
  - "Files under System32\\Tasks can be hardlinked (multiple directory entries -> one inode); dedup on resolved path/inode to avoid double-counting."

naming_format: >
  Extensionless UTF-16/UTF-8 XML conforming to the Task Scheduler schema
  (http://schemas.microsoft.com/windows/2004/02/mit/task). Key elements:
  RegistrationInfo (Author, Date, URI), Triggers, Principals/Principal (UserId,
  RunLevel), Actions/Exec (Command, Arguments), Settings (Enabled). Some files may
  be non-XML or malformed - parse defensively and record a parse failure rather
  than crashing.

proves:
  - "A task was REGISTERED with a specific command, arguments, and principal as of its RegistrationInfo Date."
  - "The identity (UserId/SID) and privilege level (RunLevel, e.g. HighestAvailable) the task is configured to run as."
  - "The configured triggers (logon, boot, schedule, event) and whether the task is Enabled."
  - "The author string and (when present) the URI/path of the task within the tree."

does_not_prove:
  - "A task definition proves the task was REGISTERED, NOT that it ever FIRED - corroborate run with TaskScheduler EVTX 200/201, EID 4698/4702, Prefetch of the target binary, or registry TaskCache LastRunTime."
  - "The XML file's filesystem LastWrite time is NOT the task creation time - it changes on any edit; use the RegistrationInfo Date for registration timing (itself attacker-settable)."
  - "It does NOT prove a human (versus a script/installer/malware) created the task."
  - "Author and RegistrationInfo Date are fields inside an editable XML and can be forged/backdated - treat as claims, not anchors, until corroborated."
  - "Absence of a malicious task does NOT prove no persistence - it may have been deleted post-execution, registered only in the registry TaskCache, or use a different ASEP."

timestamp_semantics:
  registration_date: "RegistrationInfo/Date is the claimed task registration time (local time in the XML); standardize to UTC and treat as attacker-editable, corroborate with EVTX 4698."
  file_lastwrite: "The System32\\Tasks XML file MFT $SI LastWrite reflects the last modification, NOT creation - it updates on any edit and is not the registration time."
  taskcache_lastrun: "Registry TaskCache holds LastRunTime/NextRunTime - the authoritative on-host record of whether and when the task actually executed."
  reliability_note: "The unforgeable run evidence is the TaskScheduler Operational EVTX (200/201) and registry TaskCache LastRunTime, not the XML's own date fields."

version_differences:
  vista_plus: "The System32\\Tasks XML store + TaskCache registry model is used from Windows Vista/Server 2008 onward."
  legacy_xp: "Windows XP/2003 used .job binary files under C:\\Windows\\Tasks (different format); the XML store does not exist there."

# parsing_tools / limitations / anti_forensics / correlation_patterns and the
# TaskCache value detail below are project-authored forensic guidance
# (System32\Tasks XML + TaskCache registry + TaskScheduler EVTX).
taskcache_value_semantics:
  hash: "TaskCache\\Tasks\\{GUID}\\Hash = SHA-256 of the corresponding System32\\Tasks XML file - a tamper-detection control. If the on-disk XML is hand-edited without regenerating this hash, the Task Scheduler service REFUSES to run the task; a Hash that does not match the current XML therefore flags manual tampering."
  actions: "Actions = binary blob decoding to WHAT the task runs - absolute executable path, command-line arguments, working directory, or the COM object CLSID it launches. Forensically the most important TaskCache value."
  triggers: "Triggers = binary blob of the run conditions (calendar schedule, specific Windows Event IDs, idle/boot/logon states)."
  dynamic_info: "DynamicInfo = state tracker blob holding the authoritative Last Run Time and the last return/error code."
  author: "Author = arbitrary creator string; threat actors routinely spoof it to 'Microsoft Corporation' / 'SYSTEM' to blend malicious persistence into native tasks - treat as a claim, not attribution."
  sd: "SD (under TaskCache\\Tree\\<task>) = the task's security descriptor; its presence is REQUIRED for the GUI / schtasks / Autoruns to enumerate the task (see anti_forensics ghost-task)."

parsing_tools:
  - "RECmd / Registry Explorer (Eric Zimmerman) with the TaskCache batch/plugin - parses TaskCache\\{Tree,Tasks}, decoding the Actions and DynamicInfo blobs (command path, args, LastRunTime, return code) and the Tree GUID linkage from the SOFTWARE hive."
  - "Raw XML read - System32\\Tasks files are plain XML; parse the Actions/Exec Command+Arguments, Triggers, Principal (UserId/RunLevel), RegistrationInfo (Author/Date/URI), Settings (Enabled) directly. Parse defensively - some files are malformed; record a parse failure rather than crashing."
  - "Autoruns (Sysinternals) - enumerates registered tasks as ASEPs (but relies on the SD value and so MISSES ghost tasks - see anti_forensics)."
  - "KAPE - triage-collects both System32\\Tasks and the SOFTWARE hive for offline TaskCache parsing."
  - "rla.exe (Zimmerman) - replay SOFTWARE hive transaction logs (.LOG1/.LOG2) before parsing TaskCache so LastRunTime/registration are accurate."

limitations:
  - "Registered != fired - the XML/TaskCache prove a task exists; only TaskScheduler EVTX 200/201, DynamicInfo LastRunTime, or Prefetch of the target prove it actually ran."
  - "The XML filesystem LastWrite is EDIT time, not creation - any edit updates it; use RegistrationInfo Date for registration timing (itself attacker-editable)."
  - "Author and RegistrationInfo Date live inside an editable XML / spoofable TaskCache value - forgeable, treat as claims until corroborated by EVTX 4698/106."
  - "Deleted tasks leave no XML and may leave no Tree key - run evidence then survives ONLY in EVTX (4698 carries the raw XML; TaskScheduler 106/200/201 persist longer than the Security log) - absence of an XML is not absence of the activity."
  - "Hundreds of legitimate \\Microsoft\\Windows\\ built-in tasks create heavy baseline noise - off-baseline tasks must be isolated to be useful."

anti_forensics:
  techniques:
    - "Ghost task - delete the SD (security descriptor) value from TaskCache\\Tree\\<task> so the Task Scheduler GUI, schtasks.exe, and Autoruns all fail to enumerate the task while it still runs (technique used by HAFNIUM)."
    - "Registry-only registration - write the TaskCache keys directly without a corresponding System32\\Tasks XML (or vice-versa) to evade tools that look at only one side."
    - "Backdating / spoofing RegistrationInfo Date and Author (e.g. 'Microsoft Corporation') so the task masquerades as a built-in."
    - "Delete the task immediately after it fires (cleanup) - removes XML + Tree key, leaving only EVTX."
    - "Hijack a legitimate task by editing its XML Action to point at a malicious binary (must also regenerate the TaskCache Hash or the service refuses to run it)."
  detection:
    - "Ghost-task hunt - enumerate TaskCache\\Tree keys directly and flag any task key LACKING an SD value (invisible to GUI/Autoruns/schtasks but live)."
    - "XML <-> TaskCache reconciliation - an XML with no matching Tasks\\{GUID} (or a Tree/Tasks GUID with no XML) is an anomaly: manual file drop or registry-only registration."
    - "Hash mismatch - if TaskCache\\Tasks\\{GUID}\\Hash does not match the SHA-256 of the current on-disk XML, the XML was hand-edited (hijack) since registration."
    - "EVTX recovery of deleted tasks - even with XML+Tree removed, Security EID 4698 contains the raw task XML (revealing the exact <Command>) and TaskScheduler 106/141/200/201 reconstruct the create/delete/run timeline."
    - "Off-baseline + off-path - non-Microsoft task whose Action runs from Temp/AppData/Public/$Recycle.Bin, with a raw-IP argument or encoded PowerShell, especially at RunLevel=HighestAvailable."

corroborate_with:
  event_logs_security: "Security EID 4698 (task created) / 4699 (deleted) / 4702 (updated) record the action with the registering user - and 4698's payload includes the RAW task XML, revealing the exact <Command> even if the task was immediately deleted (requires Object Access auditing)."
  taskscheduler_operational: "TaskScheduler/Operational log (persists longer than Security): EID 106 task registered (user + task name), 140 updated, 141 deleted, 200 action started, 201 action completed (gives the exact command path executed + return code). The authoritative run/lifecycle timeline that survives task deletion."
  prefetch: "Prefetch of the task's target binary corroborates that the action executed."
  registry_taskcache: "TaskCache {Tree,Tasks} LastRunTime confirms execution and the GUID linkage; an XML present with no TaskCache entry (or vice versa) is itself an anomaly."
  amcache_shimcache: "Amcache/ShimCache corroborate the target binary was present and observed by Windows."
  event_logs_security_4688: "EID 4688 process creation under the Task Scheduler service (svchost taskeng/taskhostw parent) corroborates the spawned action."

corroboration_escalation:
  alone: >
    A task XML ALONE is an OBSERVATION (~0.70) that a task was registered with a
    given command/principal as of a (editable) date - it does not prove the task
    ever fired or who created it. Treat a lone off-baseline task as a persistence
    lead to corroborate, not proof of executed persistence.
  combinations:
    - sources: ["scheduled_tasks", "event_logs_security (EID 4698/4702)"]
      plus_timestamps: "XML command/principal matched to a 4698 task-created event time + registering user"
      upgrades_to: "PROBABLE registered persistence (~0.85)"
      rationale: "4698 independently dates the registration and names the user that created the task."
    - sources: ["scheduled_tasks", "taskscheduler_operational (200/201)", "prefetch"]
      plus_timestamps: "task action-started (200) aligned with Prefetch last-run of the target binary"
      upgrades_to: "CONFIRMED executed persistence (~1.0)"
      rationale: "Registration (XML) + actual run (200/201) + execution proof (Prefetch) form a court-defensible executed-persistence stack."
  tiers: "1 source = observation (~0.70); 2 independent = probable (~0.85); 3+ with timestamp alignment = confirmed/definitive (~1.0)."

correlation_patterns:
  - name: "Registered-to-executed persistence"
    chain: "System32\\Tasks XML / TaskCache entry (registration) -> Security 4698 or TaskScheduler 106 (OS processed the registration + user) -> TaskScheduler 200/201 (action started/completed + return code) -> EID 4688 with parent 'svchost.exe -k netsvcs -p -s Schedule' + Prefetch of the target = definitively PROVEN executed persistence."
  - name: "Lateral-movement task drop"
    chain: "Security EID 4624 Logon Type 3 (network logon) from an external host -> in the SAME second a task is registered (TaskScheduler 106 / Security 4698) -> confirms remote scheduled-task creation as the lateral-movement mechanism (T1053.005)."
  - name: "Ghost-task uncovering"
    chain: "Task running (4688 under Schedule svchost / TaskScheduler 200) but invisible to Autoruns/schtasks -> hunt TaskCache\\Tree for keys lacking an SD value -> recover the hidden task; pivot 4698 raw XML for the command."
  - name: "Task-hijack detection"
    chain: "Legitimate task suddenly runs an off-path binary -> compare TaskCache Hash to SHA-256 of the current XML; mismatch proves post-registration XML edit -> 4702/140 dates the modification."
  - name: "Deleted-task reconstruction"
    chain: "No XML and no Tree key (cleanup) -> Security 4698 raw XML recovers the command + principal -> TaskScheduler 106/200/201/141 reconstruct create->run->delete timeline -> Prefetch/Amcache of the target prove the action executed before deletion."

heuristics:
  - "Emit ALL tasks for completeness but baseline the hundreds of legitimate \\Microsoft\\Windows\\ built-ins (builtin_baseline flag) so off-baseline tasks surface."
  - "Flag off-path/suspicious actions case-agnostically: commands in Temp/AppData/Public/$Recycle.Bin, raw-IP arguments, encoded PowerShell - never hardcode case-specific IOCs."
  - "RunLevel=HighestAvailable on a non-Microsoft task is a privilege/persistence signal - corroborate the principal and command."
  - "Use RegistrationInfo Date for registration timing, NOT the file LastWrite (which is edit time); corroborate both against EVTX 4698."
  - "An XML with no matching registry TaskCache entry (or vice versa) is an anomaly worth noting - possible manual file drop or registry-only registration."
  - "A spoofed Author ('Microsoft Corporation'/'SYSTEM') on a task whose Action runs from a user-writable path is masquerade - Author is arbitrary text, never attribution."
  - "Enumerate TaskCache\\Tree directly for keys lacking an SD value - ghost tasks are invisible to the GUI/Autoruns/schtasks but still execute."
  - "When a task is missing on disk, do NOT conclude 'no persistence' - the run history survives in 4698 (raw XML) and TaskScheduler 106/200/201 which persist longer than the Security log."
  - "Dedup hardlinked task files on resolved path/inode before counting."

discipline_reminder: >
  Registered != fired. A System32\\Tasks XML proves a task was REGISTERED with a
  given command/principal as of an editable RegistrationInfo Date - an OBSERVATION
  (~0.70), NOT proof it ever executed or who created it. The XML file LastWrite is
  edit time, not creation, and Author/Date are forgeable fields. Write defensibly:
  "a scheduled task {name} is registered to run {command} as {principal}," not
  "the attacker ran {command} via a scheduled task." Upgrade to PROBABLE (~0.85)
  with EVTX 4698/4702 and to CONFIRMED (~1.0) with TaskScheduler 200/201 +
  Prefetch timestamp alignment proving the action actually ran. Negative space
  matters: a deleted or registry-only task leaves no XML - absence is not innocence.
